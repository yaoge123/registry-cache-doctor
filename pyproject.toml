[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "registry-cache-doctor"
version = "0.1.0"
description = "Diagnose and repair Redis blob descriptor cache inconsistencies in distribution registries."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "yaoge123" },
]
keywords = [
    "docker",
    "registry",
    "distribution",
    "redis",
    "cache",
    "blob",
    "pull-through-cache",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "redis>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
    "fakeredis>=2.20",
]

[project.scripts]
rcd = "rcd.cli:main"

[project.urls]
Homepage = "https://github.com/yaoge123/registry-cache-doctor"
Issues = "https://github.com/yaoge123/registry-cache-doctor/issues"
Changelog = "https://github.com/yaoge123/registry-cache-doctor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rcd"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rcd",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/rcd"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
