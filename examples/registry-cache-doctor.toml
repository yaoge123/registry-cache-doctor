# registry-cache-doctor configuration template.
#
# Copy this file to `registry-cache-doctor.toml` and edit it for your
# environment. The default search path is, in order:
#
#   1. The path passed via `--config`
#   2. The path in the `RCD_CONFIG` environment variable
#   3. `./registry-cache-doctor.toml`
#   4. `~/.config/registry-cache-doctor/config.toml`
#
# Any field commented out below uses its built-in default.

schema_version = 1

# ----- Redis client tuning ---------------------------------------------------
[redis]
socket_timeout = 10
socket_connect_timeout = 5
# SCAN cursor batch size. Larger = fewer round-trips, but each batch
# blocks the Redis single thread for longer.
scan_count = 1000
# How many `(SREM, DEL, HDEL)` triplets to send per pipeline flush
# during `clean`. 200 triplets = 600 commands per batch.
pipeline_batch = 200

# ----- Scan options ----------------------------------------------------------
[scan]
# 0 = scan all enabled registries in parallel.
# Any positive integer caps concurrency at that number.
parallel = 0
# Recompute sha256 of each blob to detect digest mismatches.
# Expensive (re-reads the entire blob); leave off for routine use.
verify_digest = false

# ----- Clean options ---------------------------------------------------------
[clean]
# When true, `clean` exits with code 4 if any (repo, digest) entry could
# not be removed even after retries. When false (default), permanent
# failures are still logged but do not affect the exit code.
strict = false
# How many times to retry the failed (repo, digest) pairs from a batch.
retry = 1
# Whether to clear the C1/C2/C3/C6 "internal garbage" categories in
# addition to the C4/C5 real-failure categories. C7 is never touched.
clear_internal_garbage = true

# ----- Daemon options --------------------------------------------------------
# Daemon scheduling and auto-clean are *deployment-level* concerns, set via
# the container's environment variables (consumed by entrypoint.sh):
#
#   RCD_SCHEDULE             cron expression supercronic understands
#                            (default: "0 3 * * *", daily at 03:00)
#   RCD_DAEMON_AUTO_CLEAN    "true" to append `clean --apply` after each scan
#                            (default: "false", scan-only)
#
# Only behavioural switches that should travel with the configuration belong
# here. Setting `schedule` or `auto_clean` in TOML is rejected as an error
# to avoid silent precedence surprises.
[daemon]
# When true, the daemon's scheduled `scan` exits 3 if it finds any C4/C5
# real failure, and (when AUTO_CLEAN is on) exits 4 on permanent clean
# failure. When false, the daemon stays at exit code 0 for all drift; the
# wrapper still rewrites `2 -> 0` so cron does not log false alarms.
strict = false

# ----- Output ----------------------------------------------------------------
[output]
quiet = false
no_color = false
# When true, scan events include a (capped) list of digests per
# category. Off by default; use `rcd inspect` for full detail.
include_digest_list = false

# ----- Registries ------------------------------------------------------------
# Each registry instance gets one [[registry]] block.
# Replace the placeholder values with your real ones.
#
# `storage_path` is the path **as visible inside the rcd container**.
# Mount the host's distribution storage tree into the rcd container with
# `-v <host-path>:<host-path>:ro` (read-only is fine — `rcd` never writes
# to the storage tree) and put that same path here. The directory must
# match the registry's `<rootdirectory>` so `<storage_path>/docker/registry/v2/blobs/...`
# resolves to the actual blob files.

[[registry]]
name = "my-registry"
redis_host = "my-registry-redis"
redis_port = 6379
storage_path = "/var/lib/registry"
# redis_password = ""
# redis_db = 0
# enabled = true
