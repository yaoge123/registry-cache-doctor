# registry-cache-doctor configuration template.
#
# Copy this file to `registry-cache-doctor.toml` and edit it for your
# environment. The default search path is, in order:
#
#   1. The path passed via `--config`
#   2. The path in the `RCD_CONFIG` environment variable
#   3. `./registry-cache-doctor.toml`
#   4. `$XDG_CONFIG_HOME/registry-cache-doctor/config.toml`
#   5. `~/.config/registry-cache-doctor/config.toml`
#
# Two kinds of configuration coexist by design:
#
# * Deployment-level (how the container is wired up) lives in
#   environment variables consumed by entrypoint.sh:
#     - RCD_CONFIG              path to this file inside the container
#     - RCD_SCHEDULE            cron expression for daemon mode
#                               (default "0 3 * * *")
#     - RCD_DAEMON_AUTO_CLEAN   "true" appends `clean --apply` after each
#                               scheduled scan (default "false")
#     - RCD_DAEMON_STRICT       "true" adds `--strict` to the scheduled
#                               scan/clean (default "false")
#
# * Behavioural defaults travel with the configuration and live in this
#   file. Per-invocation CLI flags (`--strict / --no-strict`,
#   `--apply`, `--parallel`) override the values here.

schema_version = 1

# ----- Redis client tuning ---------------------------------------------------
[redis]
socket_timeout = 10
socket_connect_timeout = 5
# SCAN cursor batch size. Larger = fewer round-trips, but each batch
# blocks the Redis single thread for longer.
scan_count = 1000
# How many `(SREM, DEL, HDEL)` triplets to send per pipeline flush
# during `clean`. 200 triplets = 600 commands per batch.
pipeline_batch = 200

# ----- Scan options ----------------------------------------------------------
[scan]
# 0 = scan all enabled registries in parallel.
# Any positive integer caps concurrency at that number.
parallel = 0
# Default for `rcd scan --strict / --no-strict`. When true, `scan`
# exits 3 if any C4/C5 real failure is found. When false, drift only
# reports exit 2.
strict = false

# ----- Clean options ---------------------------------------------------------
[clean]
# Default for `rcd clean --strict / --no-strict`. When true, `clean`
# exits 4 if any (repo, digest) entry could not be removed even after
# retries. When false (default), permanent failures are logged but do
# not affect the exit code.
strict = false
# How many times to retry the failed (repo, digest) pairs from a batch.
retry = 1
# Whether to clear the C1/C2/C3/C6 "internal garbage" categories in
# addition to the C4/C5 real-failure categories. C7 is never touched.
clear_internal_garbage = true

# ----- Registries ------------------------------------------------------------
# Each registry instance gets one [[registry]] block.
# Replace the placeholder values with your real ones.
#
# `storage_path` is the path **as visible inside the rcd container**.
# Mount the host's distribution storage tree into the rcd container with
# `-v <host-path>:<host-path>:ro` (read-only is fine — `rcd` never writes
# to the storage tree) and put that same path here. The directory must
# match the registry's `<rootdirectory>` so `<storage_path>/docker/registry/v2/blobs/...`
# resolves to the actual blob files.

[[registry]]
name = "my-registry"
redis_host = "my-registry-redis"
redis_port = 6379
storage_path = "/var/lib/registry"
# redis_password = ""
# redis_db = 0
# enabled = true
